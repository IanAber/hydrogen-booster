<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hydrogen Booster API Documentation</title>
<style>
  :root {
    --bg: #0f1417; --panel: #171f24; --panel2: #1e2830; --border: #2a3742;
    --text: #e6edf2; --muted: #8b9aa5; --accent: #3aa0ff; --good: #35c26b;
    --warn: #f2b53d; --bad: #ef4b4b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .banner {
    background: #000; display: flex; align-items: center; justify-content: space-between;
    gap: 16px; padding: 12px 24px;
  }
  .banner-logo { height: 40px; width: auto; display: block; }
  .banner-title {
    margin: 0; color: #fff; font-size: 28px; font-weight: 700;
    letter-spacing: .02em; text-align: left;
  }
  @media (max-width: 600px) { .banner-title { font-size: 20px; } }
  header {
    padding: 16px 24px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 10px;
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; }
  header nav { display: flex; align-items: center; gap: 16px; }
  header nav a { color: var(--muted); font-size: 13px; text-decoration: none; }
  header nav a:hover { color: var(--text); }
  main { padding: 20px 24px; max-width: 900px; margin: 0 auto; }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 18px 20px; margin-bottom: 16px;
  }
  .endpoint-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .method {
    display: inline-block; padding: 3px 9px; border-radius: 6px; font-weight: 700;
    font-size: 12px; letter-spacing: .03em; background: var(--panel2); color: var(--accent);
  }
  .path { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 15px; font-weight: 600; }
  .auth { font-size: 12px; color: var(--muted); margin-left: auto; }
  .summary { margin: 8px 0; }
  .body-block { margin-top: 8px; }
  .body-label { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 4px; }
  pre {
    background: var(--panel2); border: 1px solid var(--border); border-radius: 6px;
    padding: 10px 12px; margin: 0; font-size: 13px; overflow-x: auto;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; word-break: break-word;
  }
  .muted { color: var(--muted); font-size: 13px; }
</style>
<script src="/i18n.js"></script>
</head>
<body>

<div class="banner">
  <h1 class="banner-title" id="bannerTitle">Hydrogen Booster</h1>
  <img src="/images/logo.png" alt="Logo" class="banner-logo">
</div>

<header>
  <h1 data-i18n="docs_page_title">API Documentation</h1>
  <nav>
    <a href="/operator.html">&larr; <span data-i18n="nav_dashboard">Dashboard</span></a>
    <a href="/admin.html" data-i18n="nav_admin">Admin / Config</a>
    <a href="/diagnostics.html" data-i18n="nav_diagnostics">Diagnostics</a>
  </nav>
</header>

<main>
  <p class="muted" data-i18n="docs_page_hint">Every HTTP endpoint this device serves. Endpoint names, request/response bodies and JSON field names below are not translated.</p>
  <div id="endpointList"></div>
</main>

<script>
async function loadDocs() {
  const container = document.getElementById('endpointList');
  try {
    const res = await fetch('/api/docs');
    const endpoints = await res.json();
    container.innerHTML = endpoints.map(e => `
      <div class="card">
        <div class="endpoint-head">
          <span class="method">${e.method}</span>
          <span class="path">${e.path}</span>
          <span class="auth">${e.auth}</span>
        </div>
        <div class="summary">${e.summary}</div>
        ${e.request ? `<div class="body-block"><div class="body-label">Request</div><pre>${e.request}</pre></div>` : ''}
        ${e.response ? `<div class="body-block"><div class="body-label">Response</div><pre>${e.response}</pre></div>` : ''}
      </div>
    `).join('');
  } catch (e) {
    container.textContent = 'Failed to load API documentation: ' + e;
  }
}

initI18n().then(() => {
  document.title = t('docs_page_title') + ' - Hydrogen Booster';
  loadDocs();
});
</script>

</body>
</html>
